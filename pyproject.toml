[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-loop"
version = "1.0.0"
description = "Learn Loop: Autonomous agentic educational lesson generator with closed-loop evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "langgraph>=0.2.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "groq>=0.11.0",
    "textstat>=0.7.3",
    "sympy>=1.13.0",
    "nicegui>=2.0.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "live: marks tests requiring active external LLM credentials (skipped when GROQ_API_KEY is unset)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "docs",
    "tests/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/fixtures",
    ".venv",
]
