name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy shared generation evaluation guardrails hallucination memory agent api

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v -m "not live"

      - name: Run Demo Rejection Script
        run: |
          python scripts/demo_rejection.py --seed-flaw jargon
          python scripts/demo_rejection.py --seed-flaw code
          python scripts/demo_rejection.py --seed-flaw citation
